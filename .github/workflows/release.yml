name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: nitrate-linux-x64
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: nitrate-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: nitrate-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            asset: nitrate-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: nitrate-windows-x64.exe
            windows: true
    runs-on: ${{ matrix.os }}
    env:
      NITRATE_GITHUB_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl gcc
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package unix
        if: ${{ !matrix.windows }}
        run: |
          bin="target/${{ matrix.target }}/release/nitrate"
          strip "$bin" || true
          cp "$bin" "${{ matrix.asset }}"
      - name: package windows
        if: matrix.windows
        shell: pwsh
        run: Copy-Item "target/${{ matrix.target }}/release/nitrate.exe" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: stamp installer
        run: |
          sed "s|scrtx/video-tools|${GITHUB_REPOSITORY}|g" install.sh > dist/install.sh
          sed "s|scrtx/video-tools|${GITHUB_REPOSITORY}|g" install.ps1 > dist/install.ps1
          chmod +x dist/install.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
