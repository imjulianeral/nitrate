name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: nitrate-linux-x64.tar.gz
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: nitrate-linux-arm64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: nitrate-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: nitrate-macos-x64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: nitrate-windows-x64.zip
            windows: true
    runs-on: ${{ matrix.os }}
    env:
      NITRATE_GITHUB_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl gcc
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package unix
        if: ${{ !matrix.windows }}
        run: |
          set -eu
          bin="target/${{ matrix.target }}/release/nitrate"
          tools="target/${{ matrix.target }}/release/tools"
          strip "$bin" || true
          stage=$(mktemp -d)
          cp "$bin" "$stage/nitrate"
          mkdir -p "$stage/tools"
          cp -a "$tools"/. "$stage/tools/"
          chmod +x "$stage/nitrate" "$stage/tools/"* || true
          tar -czf "${{ matrix.asset }}" -C "$stage" nitrate tools
      - name: package windows
        if: matrix.windows
        shell: pwsh
        run: |
          $stage = New-Item -ItemType Directory -Force -Path "stage"
          Copy-Item "target/${{ matrix.target }}/release/nitrate.exe" "$stage/nitrate.exe"
          New-Item -ItemType Directory -Force -Path "$stage/tools" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/tools/*" "$stage/tools/"
          Compress-Archive -Path "$stage/nitrate.exe","$stage/tools" -DestinationPath "${{ matrix.asset }}" -Force
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: stamp installer
        run: |
          sed "s|imjulianeral/nitrate|${GITHUB_REPOSITORY}|g" install.sh > dist/install.sh
          sed "s|imjulianeral/nitrate|${GITHUB_REPOSITORY}|g" install.ps1 > dist/install.ps1
          chmod +x dist/install.sh
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
